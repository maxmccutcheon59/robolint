[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "robolint"
version = "0.1.0"
description = "Quality checks for robot learning datasets (LeRobot format): dropped frames, dead episodes, teleop glitches, frozen cameras, duplicates."
readme = "README.md"
license = "MIT"
authors = [{ name = "Max McCutcheon", email = "MaxMcCutcheon1@outlook.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyarrow>=14"]
keywords = ["robotics", "lerobot", "dataset", "data-quality", "imitation-learning", "robot-learning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.23"]
video = ["av>=12"]
all = ["huggingface_hub>=0.23", "av>=12"]
dev = ["pytest>=8", "ruff>=0.5", "huggingface_hub>=0.23", "av>=12"]

[project.scripts]
robolint = "robolint.cli:main"

[project.urls]
Homepage = "https://github.com/maxmccutcheon59/robolint"

[tool.hatch.build.targets.wheel]
packages = ["src/robolint"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
